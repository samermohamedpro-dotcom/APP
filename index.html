<!-- Le nom du fichier change à CHAQUE changement de dessin, et ce n'est pas de
     la coquetterie : une ancienne icône survivait dans les favoris malgré la
     suppression du favori, sa recréation et la navigation privée. Les
     navigateurs indexent les icônes PAR URL, dans un magasin à part qui
     ignore les en-têtes de cache — et souvent le `?v=`, coupé du chemin. La
     seule chose qu'aucun cache ne peut servir, c'est une URL jamais vue.
     CHANGER LE DESSIN, C'EST CHANGER LE NOM. Voir icones.py.
     Troisième dessin : `icone-*` (PG crème), puis `icone-baleine-*` le matin
     du 03/09/2026, puis `icone-monogramme-*` l'après-midi même.

     La .ico est déclarée sous un nom NEUF, et `favicon.ico` reste posé à
     côté sans être déclaré. C'est le dernier trou de la règle : les
     navigateurs demandent `/favicon.ico` d'eux-mêmes, sans lire cette page,
     donc ce nom-là ne peut pas changer — et c'est précisément l'URL que le
     magasin de favoris de Safari garde. On lui donne donc à préférer une
     adresse qu'il n'a jamais vue, et on laisse l'ancienne répondre pour la
     demande aveugle. Les deux portent la MÊME image.

     Le nom dit le dépôt ET la date. La date, pour que renommer au prochain
     dessin soit mécanique. Le dépôt, parce que le 03/09/2026 les icônes de
     l'app se sont retrouvées deux fois dans le dépôt du SITE : un fichier
     qui dit où il va ne se dépose pas ailleurs par distraction (règle 4). -->

// ═══════════════════════════════════════════════════════════════════
//  Démarrage hors ligne — voir sw.js pour ce qu'il fait.
//
//  TRAPPE DE SECOURS : ajouter ?sw=off à la fin de l'adresse vide tous
//  les caches et retire le service worker. Recharger ensuite sans ?sw=off
//  remet tout en place. À utiliser si le cache sert un jour quelque chose
//  d'aberrant — évite d'avoir à guider quelqu'un dans les réglages de
//  Safari par téléphone.
// ═══════════════════════════════════════════════════════════════════
(function () {
  if (!('serviceWorker' in navigator)) return;

  if (location.search.indexOf('sw=off') !== -1) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) {
        if (r.active) r.active.postMessage('purge');
        r.unregister();
      });
    }).catch(function () {});
    if (window.caches) {
      caches.keys().then(function (noms) {
        noms.forEach(function (n) { caches.delete(n); });
      }).catch(function () {});
    }
    return;
  }

  window.addEventListener('load', function () {
    // Un échec ici ne doit rien empêcher : l'app tourne exactement comme
    // avant, simplement sans démarrage hors ligne.
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
})();
</script>
